<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Deadlines</title>

  <!-- Main CSS -->
  <link rel="stylesheet" href="../css/style.css" />
</head>

<body>

  <!-- ================= HEADER ================= -->
  <div class="header">
    <div class="logo-area">
      <img src="../imgs/AWJ_logo.png" alt="AWJ logo" width="100" />
    </div>

    <div class="header-right">
      <a href="Reminders.html">
        <img src="../imgs/Notification.png" class="notif-icon" alt="notifications">
      </a>

      <button id="themeToggle" class="dark-mode-btn">
        <img src="../imgs/Moon.png" alt="theme icon">
      </button>
    </div>
  </div>

  <!-- ================= SIDEBAR ================= -->
  <div class="sidebar">
    <div class="menu">
      <a href="dashboard.html">Dashboard</a>
      <a href="courses.html">Courses</a>
      <a href="deadlines.html">Deadlines</a>
      <a href="availability.html">Availability</a>
      <a href="studyplan.html">Study Plan</a>
      <a href="progress.html">Progress</a>
    </div>

    <a href="login.html" class="logout-link">Logout</a>
  </div>

  <!-- ================= MAIN CONTENT ================= -->
  <div class="content">

    <h1>Deadline Management</h1>
    <p>Track your assignments and exams easily.</p>

    <!-- ================= ADD DEADLINE ================= -->
    <div class="card">
      <h2>Add New Deadline</h2>

      <div class="deadline-row">

        <!-- Task Name -->
        <input type="text" id="taskName" placeholder="Enter subject / task name" />

        <!-- Type -->
        <select id="taskType">
          <option value="">Type</option>
          <option value="Exam">Exam</option>
          <option value="Assignment">Assignment</option>
        </select>

        <!-- Date -->
        <input type="date" id="taskDate" />

        <!-- Add Button (right side) -->
        <button id="addDeadlineBtn" class="btn">Add</button>

      </div>
    </div>

    <!-- ================= DEADLINE LIST ================= -->
    <div class="card">
      <h2>Upcoming Deadlines</h2>

      <div id="deadlinesContainer"></div>

      <div id="emptyDeadlines" class="empty-state">
        No deadlines added yet.
      </div>
    </div>

  </div>

  <!-- ================= EDIT MODAL ================= -->
  <div id="editModal" class="modal">

    <div class="modal-content">

      <span class="close-modal" id="closeModal">✖</span>

      <h2>Edit Deadline</h2>

      <input type="text" id="editTitle" placeholder="Edit title" />

      <select id="editType">
        <option value="Exam">Exam</option>
        <option value="Assignment">Assignment</option>
      </select>

      <input type="date" id="editDate" />

      <button id="saveEditBtn" class="btn">Save Changes</button>

    </div>
  </div>

  <!-- ================= TOAST ================= -->
  <div id="toast" class="toast"></div>

  <!-- ================= SCRIPT ================= -->
  <script src="../js/deadlines.js"></script>

</body>
</html>
