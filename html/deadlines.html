<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Deadlines</title>

  <!-- CSS -->
  <link rel="stylesheet" href="../css/style.css" />
</head>

<body>

  <!-- ================= HEADER ================= -->
  <div class="header">

    <div class="logo-area">
      <img 
        src="../imgs/AWJ_logo.png" 
        alt="AWJ logo" 
        width="100"
      />
    </div>

    <div class="header-right">

      <!-- Notifications -->
      <a href="Reminders.html">
        <img 
          src="../imgs/Notification.png"
          class="notif-icon"
          alt="notifications"
        >
      </a>

      <!-- Theme Toggle -->
      <button id="themeToggle" class="dark-mode-btn">

        <img 
          src="../imgs/Moon.png"
          alt="theme icon"
        >

      </button>

    </div>

  </div>

  <!-- ================= SIDEBAR ================= -->
  <div class="sidebar">

    <div class="menu">

      <a href="dashboard.html">
        Dashboard
      </a>

      <a href="courses.html">
        Courses
      </a>

      <a href="deadlines.html">
        Deadlines
      </a>

      <a href="availability.html">
        Availability
      </a>

      <a href="studyplan.html">
        Study Plan
      </a>

      <a href="progress.html">
        Progress
      </a>

    </div>

    <a href="login.html" class="logout-link">
      Logout
    </a>

  </div>

  <!-- ================= MAIN CONTENT ================= -->
  <div class="content">

    <!-- PAGE TITLE -->
    <h1>

      <img 
        src="../imgs/hourglass.png"
        class="title-icon"
        alt=""
      >

      Deadline Management

    </h1>

    <p>

      <img 
        src="../imgs/checkMark.png"
        class="mini-icon"
        alt=""
      >

      Track your assignments and exams easily.

    </p>

    <!-- ================= ADD DEADLINE CARD ================= -->
    <div class="card">

      <h2>

        <img 
          src="../imgs/purpleBook.png"
          class="section-icon"
          alt=""
        >

        Add New Deadline

      </h2>

      <div class="deadline-row">

        <!-- COURSE -->
        <select id="taskCourse">

          <option value="">
            Select Course
          </option>

        </select>

        <!-- TASK TITLE -->
        <input
          type="text"
          id="taskName"
          placeholder="Enter task title"
        />

        <!-- TYPE -->
        <select id="taskType">

          <option value="">
            Type
          </option>

          <option value="Exam">
            Exam
          </option>

          <option value="Assignment">
            Assignment
          </option>

        </select>

        <!-- DATE -->
        <input 
          type="date" 
          id="taskDate" 
        />

        <!-- ADD BUTTON -->
        <button id="addDeadlineBtn" class="btn">

          <img 
            src="../imgs/checkMark.png"
            class="btn-icon"
            alt=""
          >

          Add

        </button>

      </div>

    </div>

    <!-- ================= DEADLINES LIST ================= -->
    <div class="card">

      <h2>

        <img 
          src="../imgs/clock.png"
          class="section-icon"
          alt=""
        >

        Upcoming Deadlines

      </h2>

      <!-- DEADLINES -->
      <div id="deadlinesContainer"></div>

      <!-- EMPTY STATE -->
      <div id="emptyDeadlines" class="empty-state">

        <img 
          src="../imgs/wavingHand.png"
          class="empty-icon"
          alt=""
        >

        <p>No deadlines added yet.</p>

      </div>

    </div>

  </div>

  <!-- ================= EDIT MODAL ================= -->
  <div id="editModal" class="modal">

    <div class="modal-content">

      <!-- CLOSE -->
      <span class="close-modal" id="closeModal">
        ✖
      </span>

      <h2>

        <img 
          src="../imgs/pinkBook.png"
          class="section-icon"
          alt=""
        >

        Edit Deadline

      </h2>

      <!-- TITLE -->
      <input
        type="text"
        id="editTitle"
        placeholder="Edit title"
      />

      <!-- TYPE -->
      <select id="editType">

        <option value="Exam">
          Exam
        </option>

        <option value="Assignment">
          Assignment
        </option>

      </select>

      <!-- DATE -->
      <input 
        type="date" 
        id="editDate" 
      />

      <!-- SAVE -->
      <button id="saveEditBtn" class="btn">

        <img 
          src="../imgs/success.png"
          class="btn-icon"
          alt=""
        >

        Save Changes

      </button>

    </div>

  </div>

  <!-- ================= TOAST ================= -->
  <div id="toast" class="toast"></div>

  <!-- ================= SCRIPT ================= -->
  <script src="../js/deadlines.js"></script>

</body>

</html>
