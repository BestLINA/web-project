<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reminders</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <!-- Toast notification -->
    <div id="toast" class="toast"></div>

    <!-- Header -->
    <div class="header">
        <div class="logo-area">
            <img src="../imgs/AWJ_logo.png" alt="AWJ logo" width="100" id="siteLogo">
        </div>
        <div class="header-right">

            <!-- Notification bell with red dot -->
            <a href="Reminders.html" id="notifLink" class="notif-wrapper">
                <img src="../imgs/Notification.png" class="notif-icon" alt="notifications">
                <span class="notif-dot" id="notifDot"></span>
            </a>

            <!-- Theme toggle -->
            <button id="themeToggle" class="dark-mode-btn">
                <img id="themeIcon" src="../imgs/Moon.png" alt="theme icon">
            </button>

        </div>
    </div>

    <!-- Sidebar -->
    <div class="sidebar">
        <div class="menu">
            <a href="dashboard.html"> Dashboard</a>
            <a href="courses.html"> Courses</a>
            <a href="deadlines.html"> Deadlines</a>
            <a href="availability.html"> Availability</a>
            <a href="studyplan.html"> Study Plan</a>
            <a href="progress.html"> Progress</a>
        </div>
        <a href="login.html" class="logout-link"> Logout</a>
    </div>

    <!-- Content -->
    <div class="content reminders-container">

        <!-- Top section -->
        <div class="reminders-top">
            <h1>Reminder Notifications</h1>
            <p class="subtitle">Stay on top of assignments, deadlines, and study sessions.</p>
            <div class="hero-meta">
                <span class="week-tag">
                    <img src="../imgs/clock.png" class="mini-icon" alt="clock"> <span id="todayDate"></span>
                </span>
            </div>
        </div>

        <!-- Empty state — shown when no reminders at all -->
        <div id="emptyState" class="empty-state">
            <img src="../imgs/purpleLightbulb.png" class="empty-icon" alt="no reminders">
            <p>No upcoming reminders. Keep up the good work!</p>
        </div>

        <!-- Unread section -->
        <div id="unreadSection" class="reminder-section">
            <h2 class="reminder-section-title">
                <img src="../imgs/warningRed.png" class="section-icon" alt="warningRed">
                Unread
                <span class="reminder-count" id="unreadCount">0</span>
            </h2>
            <div class="reminder-box" id="unreadContainer"></div>
        </div>

        <!-- Already read section -->
        <div id="readSection" class="reminder-section">
            <h2 class="reminder-section-title">
                <img src="../imgs/checkMark.png" class="section-icon" alt="checkMark">
                Already Read
            </h2>
            <div class="reminder-box" id="readContainer"></div>
        </div>

    </div>

    <script src="../js/theme.js"></script>
    <script src="../js/Reminders.js"></script>
</body>

</html>
