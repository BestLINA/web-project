<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Progress</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <!-- Header -->
    <div class="header">
        <div class="logo-area">
            <img src="../imgs/AWJ_logo.png" alt="AWJ logo" width="100" id="siteLogo">

        </div>
        <div class="header-right">

            <!-- Notification (clickable) -->
            <a href="Reminders.html" id="notifLink" class="notif-wrapper">
                <img src="../imgs/Notification.png" class="notif-icon" alt="notifications">
                <span class="notif-dot" id="notifDot"></span>
            </a>

            <!-- Theme toggle -->
            <button id="themeToggle" class="dark-mode-btn">
                <img id="themeIcon" src="../imgs/Moon.png" alt="theme icon">
            </button>

        </div>
    </div>

    <!-- Sidebar -->
    <div class="sidebar">
        <div class="menu">
            <a href="dashboard.html"> Dashboard</a>
            <a href="courses.html"> Courses</a>
            <a href="deadlines.html"> Deadlines</a>
            <a href="availability.html"> Availability</a>
            <a href="studyplan.html"> Study Plan</a>
            <a href="progress.html"> Progress</a>
        </div>
        <a href="login.html" class="logout-link"> Logout</a>
    </div>

    <!-- Content -->
    <div class="content">

        <h1> Study Progress</h1>

        <div class="card">
            <p>Track your completed, pending, and missed study sessions through a simple progress overview.</p>
        </div>

        <div class="main-box">

            <!-- LEFT SECTION -->
            <div class="left">
                <div class="card">
                    <h2>📈 Progress Overview</h2>

                    <div class="pie-chart" id="pieChart">
                         <div class="center-text" id="progressPercent">
                                              0%
                         </div>
                         </div>

                        <div class="chart-info">

                        <div id="completedInfo"></div>

                        <div id="pendingInfo"></div>

                        <div id="missedInfo"></div>

                    </div>
                </div>
            </div>

            <!-- RIGHT SECTION -->
            <div class="right">

                <div class="card">

                <h2>🕒 Recent Activity</h2>

                 <div id="recentActivity"></div>

                </div>

                <div class="summary-box">

                     <h2>📌 Summary</h2>

                     <p id="completedTasks"></p>

                     <p id="pendingTasks"></p>

                     <p id="missedTasks"></p>

                     <p id="studyHours"></p>

                </div>

            </div>

        </div>

    </div>
    <script src="../js/theme.js"></script>
    <script src="../js/progress.js"></script>
</body>

</html>
