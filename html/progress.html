<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AWJ - Your Progress</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

    <!-- Header -->
    <div class="header">
        <div class="logo-area">
            <img src="../imgs/AWJ_logo.png" alt="AWJ logo" width="100" id="siteLogo">
        </div>
        <div class="header-right">
            <a href="Reminders.html" id="notifLink" class="notif-wrapper">
                <img src="../imgs/Notification.png" class="notif-icon" alt="notifications">
                <span class="notif-dot" id="notifDot"></span>
            </a>
            <button id="themeToggle" class="dark-mode-btn">
                <img id="themeIcon" src="../imgs/Moon.png" alt="theme icon">
            </button>
        </div>
    </div>

    <!-- Sidebar -->
    <div class="sidebar">
        <div class="menu">
            <a href="dashboard.html">Dashboard</a>
            <a href="courses.html">Courses</a>
            <a href="deadlines.html">Deadlines</a>
            <a href="availability.html">Availability</a>
            <a href="studyplan.html">Study Plan</a>
            <a href="progress.html">Progress</a>
        </div>
        <a href="login.html" class="logout-link">Logout</a>
    </div>

    <!-- Main Content -->
    <div class="content">

        <h1>Study Progress</h1>
        <p>Track your completed, pending, and missed study sessions through a simple progress overview.</p>

        <!-- Top Row: Pie Chart + Recent Activity -->
        <div class="main-box">

            <!-- LEFT: Pie Chart Card -->
            <div class="left">
                <div class="card">
                    <h2>
                        <img src="../imgs/graph.png" class="section-icon" alt="graph">
                        Progress Overview
                    </h2>

                    <div class="pie-chart" id="pieChart">
                        <div class="center-text" id="progressPercent">0%</div>
                    </div>

                    <div class="chart-info">
                        <div id="completedInfo"></div>
                        <div id="pendingInfo"></div>
                        <div id="missedInfo"></div>
                    </div>
                </div>
            </div>

            <!-- RIGHT: Recent Activity + Summary -->
            <div class="right">

                <div class="card">
                    <h2>
                        <img src="../imgs/clock.png" class="section-icon" alt="">
                        Recent Activity
                    </h2>
                    <div id="recentActivity"></div>
                </div>

                <div class="summary-box">
                    <h2>
                        <img src="../imgs/pin.png" class="section-icon" alt="">
                        Summary
                    </h2>
                    <p id="completedTasks"></p>
                    <p id="pendingTasks"></p>
                    <p id="missedTasks"></p>
                    <p id="studyHours"></p>
                </div>

            </div>
        </div>

        <!-- FR8.2 — Weekly Trend Chart (new section) -->
        <div class="card" id="weeklyChart">
            <!-- Populated dynamically by progress.js -->
            <p class="loading-text">Loading weekly trend...</p>
        </div>

    </div>

    <script src="../js/theme.js"></script>
    <script src="../js/progress.js"></script>
</body>

</html>
