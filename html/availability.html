<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Availability</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <!-- Toast notification -->
    <div id="toast"></div>

    <!-- Header -->
    <div class="header">
        <div class="logo-area">
            <img src="../imgs/AWJ_logo.png" alt="AWJ logo" width="100" id="siteLogo">
        </div>
        <div class="header-right">

            <!-- Notification (clickable) -->
            <a href="Reminders.html" id="notifLink" class="notif-wrapper">
                <img src="../imgs/Notification.png" class="notif-icon" alt="notifications">
                <span class="notif-dot" id="notifDot"></span>
            </a>

            <!-- Theme toggle -->
            <button id="themeToggle" class="dark-mode-btn">
                <img id="themeIcon" src="../imgs/Moon.png" alt="theme icon">
            </button>

        </div>
    </div>

    <!-- Sidebar -->
    <div class="sidebar">
        <div class="menu">
            <a href="dashboard.html"> Dashboard</a>
            <a href="courses.html"> Courses</a>
            <a href="deadlines.html"> Deadlines</a>
            <a href="availability.html"> Availability</a>
            <a href="studyplan.html"> Study Plan</a>
            <a href="progress.html"> Progress</a>
        </div>
        <a href="login.html" class="logout-link"> Logout</a>
    </div>

    <div class="content">

        <div class="availability-top">
            <div class="availability-header">
                <h1>My Availability</h1>
            </div>
            <p class="availability-subtitle">Set your weekly study hours</p>
        </div>

        <div class="availability-container">

            <!-- LEFT SIDE — Weekly Schedule -->
            <div class="availability-schedule">
                <h2>Weekly Schedule</h2>

                <!-- Saturday -->
                <div class="availability-day">
                    <div class="availability-day-left">
                        <input type="checkbox" id="check-saturday">
                        <label for="check-saturday">Saturday</label>
                    </div>
                    <div class="availability-time">
                        <select id="start-saturday">
                            <option value="" disabled selected>Start</option>
                        </select>
                        <span class="availability-dash">-</span>
                        <select id="end-saturday">
                            <option value="" disabled selected>End</option>
                        </select>
                    </div>
                </div>

                <!-- Sunday -->
                <div class="availability-day">
                    <div class="availability-day-left">
                        <input type="checkbox" id="check-sunday">
                        <label for="check-sunday">Sunday</label>
                    </div>
                    <div class="availability-time">
                        <select id="start-sunday">
                            <option value="" disabled selected>Start</option>
                        </select>
                        <span class="availability-dash">-</span>
                        <select id="end-sunday">
                            <option value="" disabled selected>End</option>
                        </select>
                    </div>
                </div>

                <!-- Monday -->
                <div class="availability-day">
                    <div class="availability-day-left">
                        <input type="checkbox" id="check-monday">
                        <label for="check-monday">Monday</label>
                    </div>
                    <div class="availability-time">
                        <select id="start-monday">
                            <option value="" disabled selected>Start</option>
                        </select>
                        <span class="availability-dash">-</span>
                        <select id="end-monday">
                            <option value="" disabled selected>End</option>
                        </select>
                    </div>
                </div>

                <!-- Tuesday -->
                <div class="availability-day">
                    <div class="availability-day-left">
                        <input type="checkbox" id="check-tuesday">
                        <label for="check-tuesday">Tuesday</label>
                    </div>
                    <div class="availability-time">
                        <select id="start-tuesday">
                            <option value="" disabled selected>Start</option>
                        </select>
                        <span class="availability-dash">-</span>
                        <select id="end-tuesday">
                            <option value="" disabled selected>End</option>
                        </select>
                    </div>
                </div>

                <!-- Wednesday -->
                <div class="availability-day">
                    <div class="availability-day-left">
                        <input type="checkbox" id="check-wednesday">
                        <label for="check-wednesday">Wednesday</label>
                    </div>
                    <div class="availability-time">
                        <select id="start-wednesday">
                            <option value="" disabled selected>Start</option>
                        </select>
                        <span class="availability-dash">-</span>
                        <select id="end-wednesday">
                            <option value="" disabled selected>End</option>
                        </select>
                    </div>
                </div>

                <!-- Thursday -->
                <div class="availability-day">
                    <div class="availability-day-left">
                        <input type="checkbox" id="check-thursday">
                        <label for="check-thursday">Thursday</label>
                    </div>
                    <div class="availability-time">
                        <select id="start-thursday">
                            <option value="" disabled selected>Start</option>
                        </select>
                        <span class="availability-dash">-</span>
                        <select id="end-thursday">
                            <option value="" disabled selected>End</option>
                        </select>
                    </div>
                </div>

                <!-- Friday -->
                <div class="availability-day">
                    <div class="availability-day-left">
                        <input type="checkbox" id="check-friday">
                        <label for="check-friday">Friday</label>
                    </div>
                    <div class="availability-time">
                        <select id="start-friday">
                            <option value="" disabled selected>Start</option>
                        </select>
                        <span class="availability-dash">-</span>
                        <select id="end-friday">
                            <option value="" disabled selected>End</option>
                        </select>
                    </div>
                </div>

            </div>

            <!-- RIGHT SIDE — Quick Tips -->
            <div class="availability-tips">
                <div class="availability-tips-header">
                    <img src="../imgs/purpleLightbulb.png" class="availability-tip-icon" alt="purple light bulb icon">
                    <h2>Quick Tips</h2>
                </div>

                <!-- <div class="availability-tip">
                    <img src="../imgs/pin.png" class="availability-pin" alt="pin icon"> Be consistent with your study hours
                </div>
                <div class="availability-tip">
                    <img src="../imgs/pin.png" class="availability-pin" alt="pin icon"> Take 10–15 min breaks every 1–2 hours
                </div>
                <div class="availability-tip">
                    <img src="../imgs/pin.png" class="availability-pin" alt="pin icon"> Avoid over-scheduling
                </div> -->
                <div id="tipsContainer">
                    <p class="availability-subtitle">Loading tips...</p>
                </div>
            </div>

        </div>

        <!-- Save button -->
        <div class="availability-bottom">
            <button class="availability-save-btn">Save Availability</button>
        </div>

    </div>

    <script src="../js/theme.js"></script>
    <script src="../js/availability.js"></script>
</body>

</html>
