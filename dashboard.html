<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Dashboard</title>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <!-- HEADER -->

    <header class="header">
      <div class="logo-area">
        <img src="imgs/AWJ_logo.png" alt="AWJ logo" width="90" />
      </div>

      <div class="header-right">
        <button id="darkModeBtn" class="dark-mode-btn">🌙 Dark Mode</button>

        <img
          src="imgs/Notification.png"
          alt="notifications"
          class="notif-icon"
        />
      </div>
    </header>

    <!-- SIDEBAR -->

    <aside class="sidebar">
      <div class="menu">
        <a href="dashboard.html" class="menu-link active"> 🏠 Dashboard </a>

        <a href="courses.html" class="menu-link"> 📚 Courses </a>

        <a href="availability.html" class="menu-link"> ⏰ Availability </a>

        <a href="studyplan.html" class="menu-link"> 📝 Study Plan </a>

        <a href="progress.html" class="menu-link"> 📈 Progress </a>
      </div>

      <a href="login.html" class="logout-link"> 🚪 Logout </a>
    </aside>

    <!-- MAIN CONTENT -->

    <main class="content">
      <!-- WELCOME -->

      <section class="welcome-section">
        <h1 id="welcomeText" class="welcome-title"></h1>

        <p class="welcome-subtitle">Stay focused and achieve your goals ✨</p>
      </section>

      <!-- STATISTICS -->

      <section class="stats-grid">
        <div class="card stat-card">
          <h3 class="card-title">Total Study Hours</h3>

          <p class="big-number" id="hoursNumber">0</p>
        </div>

        <div class="card stat-card">
          <h3 class="card-title">Completed Sessions</h3>

          <p class="big-number" id="sessionsNumber">0</p>
        </div>

        <div class="card stat-card">
          <h3 class="card-title">Focus Rate</h3>

          <p class="big-number" id="focusNumber">0%</p>
        </div>

        <div class="card stat-card">
          <h3 class="card-title">Productivity</h3>

          <p class="big-number" id="productivityNumber">0%</p>
        </div>
      </section>

      <!-- DASHBOARD GRID -->

      <section class="dashboard-grid">
        <!-- PROGRESS -->

        <div class="card progress-card">
          <h2 class="section-title">Weekly Progress</h2>

          <div class="progress-circle">
            <div class="progress-inner">
              <span id="progressText" class="progress-text"> 0% </span>
            </div>
          </div>
        </div>

        <!-- STUDY HOURS -->

        <div class="card hours-card">
          <h2 class="section-title">Weekly Study Hours</h2>

          <div id="studyStats" class="study-stats"></div>
        </div>
      </section>

      <!-- AI TIPS -->

      <section class="card ai-card">
        <h2 class="section-title">AI Study Tips</h2>

        <p id="tipText" class="tip-text">
          Click the button to generate a study tip ✨
        </p>

        <button id="tipBtn" class="tip-btn">Generate Tip</button>
      </section>
    </main>

    <script src="dashboard.js"></script>
  </body>
</html>
